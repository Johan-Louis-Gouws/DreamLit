[project]
name = "dreamlit"
version = "0.1.0"
description = "A local dream journal with source-linked CLI analysis"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "pydantic>=2.10,<3", "uvicorn>=0.34", "python-multipart>=0.0.20"]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.28",
    "cmake>=4.4.3",
    "ruff>=0.16.6",
]

[project.scripts]
dreamlit = "dreamlit.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/dreamlit"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
